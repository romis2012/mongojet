name: Python CI

on:
  push:
    branches: ['master']
  pull_request:
    branches: ['master']

jobs:
  build:
    name: "Python ${{ matrix.python-version }} ${{ matrix.os }}"
    runs-on: "${{ matrix.os }}"
    defaults:
      run:
        shell: bash -el {0}
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12', '3.13', '3.14']
        os: [ubuntu-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      
      - name: Setup rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Run Ruff Checks
        run: |
          uv run ruff check --output-format=github ./python/mongojet ./tests
          uv run ruff format --check ./python/mongojet ./tests

      - name: Run Mypy Type Checker
        run: |
          uv run mypy ./python/mongojet ./tests
      
      - name: Start MongoDB
        uses: supercharge/mongodb-github-action@1.12.1
        with:
          mongodb-version: "4.4"
          mongodb-replica-set: rs1
          mongodb-port: 27117
      
      - name: Run tests
        run: |
          uv run pytest tests --cov=./python/mongojet --cov-report xml
      
      - name: Upload coverage
        uses: codecov/codecov-action@v4.0.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: romis2012/mongojet
          file: ./coverage.xml
          flags: unit
          fail_ci_if_error: false